name: Generate Zombie Graph

on:
  schedule:
    - cron: "0 0 * * *" # Her gece yarısı haritayı günceller
  workflow_dispatch:    # Manuel tetikleme butonu

permissions:
  contents: write       # Botun README reposuna SVG'yi kaydetmesi için izin

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        
      # KENDI YAZDIĞIN ACTION'I ÇAĞIRIYORSUN!
      - name: Generate Zombie Survival Graph
        uses: achexus/github-zombie-graph@main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          game_start_date: "2026-08-15"
          
      - name: Commit and Push SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add zombi-grafik.svg
          git commit -m "update: Daily Zombie Survival Intel" || echo "No changes to commit"
          git push
