name: GitHub Zombie Survival Graph

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch: 

jobs:
  update-graph:
    runs-on: ubuntu-latest
    
    # Exit code 128 hatasını çözen kritik izin ayarı
    permissions:
      contents: write

    steps:
      # Node.js uyarısını çözmek için v4 sürümüne güncellendi
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Zombie Survival Graph
        uses: achexus/github-zombie-graph@main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          difficulty: normal
          theme: resident_evil

      - name: Commit and Push the generated SVG
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update zombie survival graph with resident evil theme"
          file_pattern: zombie-graph.svg
